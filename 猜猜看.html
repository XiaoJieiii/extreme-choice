<script>
/* ===================================================================
   极限二选一 V5 — 全歌曲平等参与 · 单败淘汰+自然轮空 · 歌手海报 · 回退支持
   =================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const STORAGE_KEY = 'xianji_erxuanyi_v6_progress';

// ── 歌手照片路径 ──
function getPhotoPath(name) {
  // URL 编码中文字符，否则 GitHub Pages 返回 404
  return encodeURI('图片/' + name + '.jpg');
}
// ── 歌手海报配色（图片加载失败时回退） ──
const POSTER_COLORS = {
  '陈奕迅': ['#e74c3c', '#c0392b'],
  '邓紫棋': ['#9b59b6', '#7d3c98'],
  '林俊杰': ['#3498db', '#2471a3'],
  '薛之谦': ['#1abc9c', '#148f77'],
  '周杰伦': ['#f39c12', '#d68910'],
  '王俊凯': ['#42a5f5', '#1e88e5'],
};
const DEFAULT_POSTER_COLORS = ['#7c4dff', '#5e35b1'];

function getPosterGradient(name) {
  const c = POSTER_COLORS[name] || DEFAULT_POSTER_COLORS;
  return 'linear-gradient(135deg, ' + c[0] + ' 0%, ' + c[1] + ' 100%)';
}

let appState = {
  currentScreen: 'search',
  selectedArtist: null,
  bracket: null,
  isTransitioning: false,
  bracketHistory: []        // 快照栈 —— 每次选择前保存一份完整副本
};

// ════════════════════════ 数据 ════════════════════════
function getArtistSongs(artist) {
  const songs = [];
  artist.albums.forEach(album => {
    album.songs.forEach(songName => {
      songs.push({ id: artist.id + '_' + album.name + '_' + songName, name: songName, albumName: album.name, albumYear: album.year });
    });
  });
  return songs;
}

// ════════════════════════ 锦标赛算法 ════════════════════════
function buildBracket(songs) {
  const shuffled = [...songs].sort(() => Math.random() - 0.5);
  const allRounds = [];
  let remaining = songs.length;

  // ★ 预创建所有轮次（第2轮起 match 内 songA/songB 为 null，等待上一轮完成后填入）
  while (remaining > 1) {
    const matchCount = Math.floor(remaining / 2);
    const hasBye = (remaining % 2 === 1);

    const matches = [];
    for (let i = 0; i < matchCount; i++) {
      matches.push({
        id: 'R' + (allRounds.length + 1) + '_M' + i,
        matchIndex: i,
        songA: null, songB: null, winnerId: null, isBye: false
      });
    }

    const label = remaining === 2 ? '决赛' :
      (remaining === 4 ? '半决赛' : '第' + (allRounds.length + 1) + '轮');

    allRounds.push({
      roundNumber: allRounds.length + 1,
      label: label,
      totalSongs: remaining,
      matchCount: matchCount,
      hasBye: hasBye,
      byeSong: null,
      matches: matches
    });

    remaining = matchCount + (hasBye ? 1 : 0);
  }

  // 将打乱后的歌曲填入第一轮
  let si = 0;
  const r0 = allRounds[0];
  for (const m of r0.matches) {
    m.songA = shuffled[si++];
    m.songB = shuffled[si++];
  }
  if (r0.hasBye) {
    r0.byeSong = shuffled[si];
  }

  return {
    artistId: null, artistName: '',
    totalSongs: songs.length,
    rounds: allRounds,
    champion: null,
    status: 'in_progress'
  };
}

function getCurrentMatch(bracket) {
  if (bracket.status === 'completed') return null;
  // 按轮次顺序：必须完成当前轮所有对局才能进入下一轮
  for (const round of bracket.rounds) {
    for (const match of round.matches) {
      if (match.isBye) continue;
      // 跳过尚未填充歌曲的 match（等待上一轮完成）
      if (!match.songA || !match.songB) continue;
      if (match.winnerId === null) {
        return { round, match };
      }
    }
  }
  return null;
}

function getCurrentRoundNumber(bracket) {
  for (const round of bracket.rounds) {
    for (const match of round.matches) {
      if (match.isBye) continue;
      if (!match.songA || !match.songB) continue;
      if (match.winnerId === null) {
        return round.roundNumber;
      }
    }
  }
  return bracket.rounds.length;
}

function getOverallProgress(bracket) {
  let total = 0, done = 0;
  for (const round of bracket.rounds) {
    for (const match of round.matches) {
      if (!match.isBye) { total++; if (match.winnerId !== null) done++; }
    }
  }
  return { total, done, pct: total > 0 ? Math.round(done / total * 100) : 0 };
}

function processPick(bracket, matchId, winnerId) {
  let pickedRound = null, pickedMatch = null;
  for (const round of bracket.rounds) {
    for (const match of round.matches) {
      if (match.id === matchId) { match.winnerId = winnerId; pickedRound = round; pickedMatch = match; break; }
    }
    if (pickedRound) break;
  }
  if (!pickedRound) return bracket;

  // 检查当前轮是否全部完成
  const allDone = pickedRound.matches.every(m => m.winnerId !== null || m.isBye);
  if (!allDone) return bracket;

  // 收集本轮胜者 + 轮空者 → 填入下一轮
  const winners = [];
  if (pickedRound.byeSong) winners.push(pickedRound.byeSong);
  pickedRound.matches.forEach(m => {
    if (m.winnerId) winners.push(m.winnerId === m.songA.id ? m.songA : m.songB);
  });

  const nextIdx = bracket.rounds.indexOf(pickedRound) + 1;
  if (nextIdx < bracket.rounds.length) {
    const nr = bracket.rounds[nextIdx];
    // 随机打乱胜者，确保下一轮配对公平
    const shuffled = [...winners].sort(() => Math.random() - 0.5);
    // 如果下一轮有轮空名额，最后一位胜者直接晋级
    if (nr.hasBye) {
      nr.byeSong = shuffled.pop();
    }
    // 填入匹配
    let wi = 0;
    for (const m of nr.matches) {
      if (!m.songA && wi < shuffled.length) { m.songA = shuffled[wi]; wi++; }
      if (!m.songB && wi < shuffled.length) { m.songB = shuffled[wi]; wi++; }
    }
    // 检查是否决赛已完成
    if (nextIdx === bracket.rounds.length - 1) {
      const fm = nr.matches[0];
      if (fm && fm.songA && fm.songB && fm.winnerId) {
        bracket.status = 'completed';
        bracket.champion = fm.winnerId === fm.songA.id ? fm.songA : fm.songB;
      }
    }
  } else {
    bracket.status = 'completed';
    bracket.champion = winners[0] || null;
  }

  return bracket;
}

function serialize(b) { return JSON.parse(JSON.stringify(b)); }
function deserialize(j) { return j; }

// ════════════════════════ 快照 / 回退 ════════════════════════
function saveBracketSnapshot() {
  appState.bracketHistory.push(serialize(appState.bracket));
}

function undoLastPick() {
  if (appState.bracketHistory.length === 0) return false;
  appState.bracket = appState.bracketHistory.pop();
  return true;
}

// ════════════════════════ UI ════════════════════════
function showScreen(name) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(name + 'Screen');
  if (el) el.classList.add('active');
  appState.currentScreen = name;
}

function goToLobby() {
  if (appState.isTransitioning) return;
  // 保存当前进度，回大厅时可能恢复
  if (appState.bracket && appState.bracket.status === 'in_progress') {
    saveProgress(appState.bracket);
  }
  appState.isTransitioning = false;
  appState.bracketHistory = [];
  showScreen('search');
  renderArtists();
  $('#searchInput').value = '';
}

function renderArtists(filter = '') {
  const db = typeof ARTISTS_DB !== 'undefined' ? ARTISTS_DB : [];
  const q = filter.toLowerCase().trim();
  const filtered = db.filter(a => a.name.toLowerCase().includes(q));
  const grid = $('#artistsGrid');
  const stats = $('#statsBar');

  if (db.length === 0) {
    stats.textContent = '⚠ 未加载到歌手数据';
    grid.innerHTML = '';
    return;
  }
  const totalS = db.reduce((s,a) => s + a.albums.reduce((ss,al) => ss + al.songs.length, 0), 0);
  stats.textContent = '共 ' + db.length + ' 位歌手 · ' + totalS + ' 首歌曲';

  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999;">😕 没找到「' + escapeHtml(filter) + '」<br><small>试试其他关键词</small></div>';
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const s = a.albums.reduce((sum, al) => sum + al.songs.length, 0);
    const photoPath = getPhotoPath(a.name);
    const gradient = getPosterGradient(a.name);
    return '<div class="artist-card" data-id="' + a.id + '">' +
      '<div class="artist-poster" style="background:' + gradient + ';">' +
        '<img src="' + photoPath + '" alt="' + a.name + '">' +
      '</div>' +
      '<div class="artist-name">' + a.name + '</div>' +
      '<div class="artist-meta">' + a.albums.length + '专辑 · ' + s + '首</div>' +
    '</div>';
  }).join('');

  grid.querySelectorAll('.artist-card').forEach(card => {
    card.addEventListener('click', () => startBattle(card.dataset.id));
  });
}

function startBattle(artistId, resumeBracket = null) {
  const db = typeof ARTISTS_DB !== 'undefined' ? ARTISTS_DB : [];
  const artist = db.find(a => a.id === artistId);
  if (!artist) return;

  appState.isTransitioning = false;
  appState.bracketHistory = [];
  appState.selectedArtist = artist;

  if (resumeBracket) {
    appState.bracket = resumeBracket;
    appState.bracket.artistName = artist.name;
    appState.bracket.artistId = artist.id;
  } else {
    const songs = getArtistSongs(artist);
    if (songs.length < 2) { alert('该歌手歌曲不足2首，无法对战'); return; }
    appState.bracket = buildBracket(songs);
    appState.bracket.artistName = artist.name;
    appState.bracket.artistId = artist.id;
  }

  showScreen('battle');
  $('#battleArtistName').textContent = artist.name;
  const b = appState.bracket;
  $('#battleSongCount').textContent = '共 ' + b.totalSongs + ' 首歌 · ' + b.rounds.length + ' 轮淘汰';
  renderBattle();
}

function renderBattle() {
  const b = appState.bracket;
  if (!b) return;
  const current = getCurrentMatch(b);
  if (!current || b.status === 'completed') { showResult(); return; }

  const { round, match } = current;
  const progress = getOverallProgress(b);
  const indicator = $('#roundIndicator');
  const isFinal = round.totalSongs === 2;

  indicator.textContent = round.label + ' · 第 ' + (match.matchIndex + 1) + ' / ' + round.matchCount + ' 场';
  indicator.className = 'round-indicator' + (isFinal ? ' final' : '');

  let byeInfo = '';
  if (round.hasBye && round.byeSong) {
    byeInfo = '<div style="text-align:center;margin-bottom:12px;font-size:13px;color:var(--bye-color);">🟢 <strong>' + round.byeSong.name + '</strong> 本轮轮空，直接晋级</div>';
  }

  $('#progressBar').style.width = progress.pct + '%';

  // ── 更新 "上一题" 按钮状态 ──
  const btnPrev = $('#btnPrev');
  btnPrev.disabled = appState.bracketHistory.length === 0;
  // tooltip 提示
  if (appState.bracketHistory.length > 0) {
    btnPrev.title = '可回退 ' + appState.bracketHistory.length + ' 步';
  } else {
    btnPrev.title = '';
  }

  const songA = match.songA, songB = match.songB;
  const card = (song, side) =>
    '<div class="song-card" data-choice="' + side + '" id="card' + side + '">' +
      '<div class="song-name">' + song.name + '</div>' +
      '<div class="choice-hint">👈 选我</div>' +
    '</div>';

  $('#pkArena').innerHTML = (byeInfo || '') +
    '<div class="pk-arena">' +
      card(songA, 'A') +
      '<div class="vs-divider"><div class="vs-circle">VS</div></div>' +
      card(songB, 'B') +
    '</div>';

  $('#cardA').addEventListener('click', () => { if (!appState.isTransitioning) handlePick(match, songA); });
  $('#cardB').addEventListener('click', () => { if (!appState.isTransitioning) handlePick(match, songB); });
}

function handlePick(match, chosenSong) {
  if (appState.isTransitioning) return;
  appState.isTransitioning = true;

  // ★ 选择前先保存快照，以便 "上一题" 回退
  saveBracketSnapshot();

  const cardA = $('#cardA'), cardB = $('#cardB');
  const chosen = chosenSong.id === match.songA.id ? cardA : cardB;
  chosen.classList.add('chosen');
  (chosen === cardA ? cardB : cardA).classList.add('fade-out');

  setTimeout(() => {
    // ★ 先清除旧卡片视觉状态，防止移动端动画残留
    chosen.classList.remove('chosen');
    (chosen === cardA ? cardB : cardA).classList.remove('fade-out');
    void $('#pkArena').offsetWidth; // 强制重绘

    appState.bracket = processPick(appState.bracket, match.id, chosenSong.id);

    // 检测是否进入了新一轮 —— 如果是，清空回退历史
    const prevHistoryLen = appState.bracketHistory.length;
    if (prevHistoryLen > 0) {
      const curRound = getCurrentRoundNumber(appState.bracket);
      const lastSnapshot = appState.bracketHistory[appState.bracketHistory.length - 1];
      const lastRound = getCurrentRoundNumber(lastSnapshot);
      if (lastRound !== curRound) {
        appState.bracketHistory = [];
      }
    }

    if (appState.bracket.status === 'completed') {
      appState.isTransitioning = false;
      appState.bracketHistory = [];
      saveProgress(null);
      showConfetti();
      showResult();
    } else {
      saveProgress(appState.bracket);
      appState.isTransitioning = false;
      renderBattle();
    }
  }, 400);
}

function showResult() {
  const b = appState.bracket;
  if (!b) return;
  showScreen('result');

  if (b.champion) {
    $('#championSong').textContent = b.champion.name;
    $('#championAlbum').textContent = '';
    $('#championStats').innerHTML = '从 <em>' + b.totalSongs + '</em> 首歌曲中脱颖而出 · 共 <em>' + b.rounds.length + '</em> 轮淘汰';
  }

  let html = '';
  b.rounds.forEach((round, roundIdx) => {
    const isLastRound = roundIdx === b.rounds.length - 1;
    html += '<div class="bracket-col">';
    html += '<div class="bracket-col-title">' + round.label + '</div>';
    html += '<div class="bracket-col-matches">';
    // 轮空歌曲
    if (round.hasBye && round.byeSong) {
      html += '<div class="bracket-match" style="border-color:var(--bye-color);background:#e8f5e9;">';
      html += '<div class="bracket-song bye">🟢 ' + round.byeSong.name + '</div>';
      html += '<div class="bracket-song bye">轮空晋级</div>';
      html += '</div>';
    }
    round.matches.forEach(match => {
      if (!match.songA || !match.songB) return;
      const aW = match.winnerId === match.songA.id;
      const bW = match.winnerId === match.songB.id;
      const hasWinner = match.winnerId !== null;
      const isChampion = isLastRound && hasWinner;
      html += '<div class="bracket-match' +
        (isChampion ? ' champion-match' : '') +
        (hasWinner && !isChampion ? ' winner-match' : '') + '">';
      html += '<div class="bracket-song' + (aW ? ' winner' : '') + (isChampion && aW ? ' champion' : '') + '">' +
        (aW ? '🏆 ' : '') + match.songA.name + '</div>';
      html += '<div class="bracket-song' + (bW ? ' winner' : '') + (isChampion && bW ? ' champion' : '') + '">' +
        (bW ? '🏆 ' : '') + match.songB.name + '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  $('#bracketTree').innerHTML = html;
}

// ════════════════════════ 持久化 ════════════════════════
function saveProgress(b) { if (b) localStorage.setItem(STORAGE_KEY, JSON.stringify(serialize(b))); else localStorage.removeItem(STORAGE_KEY); }
function loadProgress() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
function checkResume() {
  const saved = loadProgress();
  if (!saved || saved.status === 'completed') return;
  const db = typeof ARTISTS_DB !== 'undefined' ? ARTISTS_DB : [];
  const artist = db.find(a => a.id === saved.artistId);
  if (!artist) return;
  const p = getOverallProgress(saved);
  const cur = getCurrentMatch(saved);
  if (cur) {
    $('#resumeModalText').textContent = '歌手：' + artist.name + '\n进度：' + cur.round.label + ' 第 ' + (cur.match.matchIndex + 1) + ' 场\n已完成 ' + p.done + ' / ' + p.total + ' 组PK';
    $('#resumeModal').classList.add('active');
  }
}

// ════════════════════════ 庆祝 & 导出 ════════════════════════
function showConfetti() {
  const c = $('#confettiContainer');
  const colors = ['#7c4dff','#e040fb','#f9a825','#ff5252','#00e676','#40c4ff','#ff6e40'];
  for (let i=0;i<60;i++) {
    const p = document.createElement('div'); p.className='confetti-piece';
    p.style.cssText = 'left:'+Math.random()*100+'%;top:-'+Math.random()*40+'px;background:'+colors[Math.floor(Math.random()*colors.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-delay:'+Math.random()*1.5+'s;animation-duration:'+(2+Math.random()*2)+'s;width:'+(6+Math.random()*14)+'px;height:'+(6+Math.random()*14)+'px';
    c.appendChild(p);
  }
  setTimeout(()=>{c.innerHTML='';},4000);
}

async function exportBracket() {
  const loading = $('#loadingScreen'); loading.classList.add('active');
  try {
    if (typeof html2canvas === 'undefined') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('CDN 加载失败，请检查网络连接'));
        document.head.appendChild(script);
      });
    }
    const container = $('#bracketContainer');
    const canvas = await html2canvas(container, { backgroundColor:'#ffffff', scale:2, width: Math.max(container.scrollWidth, 1200), height: container.scrollHeight + 40 });
    const a = document.createElement('a');
    a.download = '极限二选一-' + (appState.bracket?.artistName || '对阵图') + '.png';
    a.href = canvas.toDataURL('image/png'); a.click();
  } catch(e) { alert('导出失败：' + e.message); }
  loading.classList.remove('active');
}

function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// ════════════════════════ 事件绑定 ════════════════════════
$('#searchInput').addEventListener('input', e => renderArtists(e.target.value));

// 返回大厅
$('#btnBackLobby').addEventListener('click', () => {
  if (appState.isTransitioning) return;
  if (appState.bracket && appState.bracket.status === 'in_progress') {
    if (!confirm('当前对战进度将保存，确定返回大厅吗？')) return;
  }
  goToLobby();
});

// 上一题
$('#btnPrev').addEventListener('click', () => {
  if (appState.isTransitioning) return;
  if (!undoLastPick()) return;
  appState.isTransitioning = false;
  saveProgress(appState.bracket);
  renderBattle();
});

// 重新开始
$('#btnReset').addEventListener('click', ()=>{
  if(confirm('确定重新开始？当前进度将丢失。')) {
    appState.bracketHistory = [];
    saveProgress(null);
    startBattle(appState.selectedArtist.id);
  }
});

$('#btnResume').addEventListener('click', ()=>{ $('#resumeModal').classList.remove('active'); const s=loadProgress(); if(s) startBattle(s.artistId, s); });
$('#btnDiscard').addEventListener('click', ()=>{ $('#resumeModal').classList.remove('active'); saveProgress(null); });
$('#btnExport').addEventListener('click', exportBracket);
$('#btnNewBattle').addEventListener('click', ()=>{ appState.bracketHistory=[]; saveProgress(null); showScreen('search'); renderArtists(); $('#searchInput').value=''; });

function init() {
  renderArtists();
  const saved = loadProgress();
  if (saved && saved.status !== 'completed') checkResume();
}
init();
</script>
